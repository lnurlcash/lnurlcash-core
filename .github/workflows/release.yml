name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Prospective release tag, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-lnurlcash-core-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::Release tags must point to a commit on origin/main"
            exit 1
          }
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "::error::Expected tag v$package_version, got $RELEASE_TAG"
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15
        with:
          components: clippy, rustfmt

      - name: Set up Node for the adversarial mint
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout the pinned conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lnurlcash/lnurlcash-conformance
          ref: v0.11.0
          path: conformance
          persist-credentials: false

      - name: Install mock-mint dependencies
        run: npm ci
        working-directory: conformance

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test against the pinned conformance suite
        run: cargo test --locked --all-features
        env:
          LNURLCASH_CONFORMANCE: ${{ github.workspace }}/conformance
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the crates.io package
        run: cargo publish --locked --dry-run

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Checkout validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
