name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Prospective release tag, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-lnurlcash-core-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::Release tags must point to a commit on origin/main"
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15
        with:
          components: clippy, rustfmt

      - name: Take the crate version from the tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH, got $RELEASE_TAG"
            exit 1
          }
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"lnurlcash-core\"$/{n;s/^version = .*/version = \"$version\"/}" Cargo.lock
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"

      - name: Set up Node for the adversarial mint
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout the pinned conformance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lnurlcash/lnurlcash-conformance
          ref: v0.16.0
          # Keep the auxiliary checkout under Cargo's ignored build tree.
          # A sibling at the repository root is seen as uncommitted package
          # content and makes `cargo publish` refuse an otherwise clean tag.
          path: target/conformance
          persist-credentials: false

      - name: Install mock-mint dependencies
        run: npm ci
        working-directory: target/conformance

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test against the pinned conformance suite
        run: cargo test --locked --all-features
        env:
          LNURLCASH_CONFORMANCE: ${{ github.workspace }}/target/conformance
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the crates.io package
        # --allow-dirty: the version stamp is the only change to the checkout
        run: cargo publish --locked --dry-run --allow-dirty

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Checkout validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-15

      - name: Take the crate version from the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH, got $RELEASE_TAG"
            exit 1
          }
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"lnurlcash-core\"$/{n;s/^version = .*/version = \"$version\"/}" Cargo.lock
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"

      - name: Skip a version crates.io already has (a re-run)
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -A "lnurlcash/lnurlcash-core release" "https://crates.io/api/v1/crates/lnurlcash-core/$version" > /dev/null; then
            echo "lnurlcash-core $version is already on crates.io"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # A short-lived token from crates.io's trusted publishing, unless the
      # environment still holds a long-lived CARGO_REGISTRY_TOKEN.
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.published.outputs.done != 'true' && env.HAS_REGISTRY_TOKEN != 'true'

      - name: Publish to crates.io
        if: steps.published.outputs.done != 'true'
        # --allow-dirty: the version stamp is the only change to the checkout
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release for the tag
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # this version's section, its own heading excluded, up to the next one
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # a re-run of a release that already has one leaves it alone
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "lnurlcash-core ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
